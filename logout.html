<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>

    <link rel="stylesheet" href="../css/logout.css">
    <script defer src="../js/logout.js"></script>
</head>
<body>

<div class="overlay">

    <div class="logout-box">

        <div class="icon">
            🚪
        </div>

        <h2>Log Out?</h2>

        <p>
            Are you sure you want to log out of your account?
        </p>

        <div class="buttons">

            <button id="cancelBtn">
                Cancel
            </button>

            <button id="logoutBtn">
                Log Out
            </button>

        </div>

    </div>

</div>

</body>
</html>
