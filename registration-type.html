<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration Type</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/registration-type.css">

<link rel="stylesheet" href="../css/animations.css">

</head>

<body>

<div class="registration-container">

<img src="../assets/logo/silicohelp-logo.png"
class="logo"
alt="Logo">

<h1 data-i18n="title">
Register With SilicoHelp
</h1>

<p class="subtitle"
data-i18n="subtitle">

Choose how you want to continue.

</p>

<div class="registration-card worker">

<div class="icon">👷</div>

<h2 data-i18n="workerTitle">

Worker Registration

</h2>

<p data-i18n="workerDescription">

Register yourself for AI-assisted occupational lung screening and compensation support.

</p>

<button class="worker-btn"
data-i18n="workerButton">

Continue as Worker

</button>

</div>

<div class="registration-card organization">

<div class="icon">🏥</div>

<h2 data-i18n="organizationTitle">

Organization Registration

</h2>

<p data-i18n="organizationDescription">

Hospital, NGO, Health Camp or Authorized Organization.

</p>

<button class="organization-btn"
data-i18n="organizationButton">

Continue as Organization

</button>

</div>

</div>

<script src="../translations/common-text.js"></script>

<script src="../translations/registration-type-text.js"></script>

<script src="../js/i18n.js"></script>

<script>
translatePage(registrationTypeText);
</script>

<script src="../js/registration-type.js"></script>

</body>

</html>
