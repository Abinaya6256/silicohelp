<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government Login | SilicoHelp</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/govlogin.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img src="../assets/logo/silicohelp-logo.png" alt="SilicoHelp Logo" class="logo">

        <div class="icon">🏛</div>

        <h1 data-i18n="govLoginTitle"></h1>

        <p data-i18n="govLoginDescription"></p>

        <form id="loginForm">

            <label data-i18n="email"></label>

            <input
    type="email"
    id="email"
    data-i18n-placeholder="govEmailPlaceholder"
    required>

            <label data-i18n="password"></label>

            <div class="password-box">

                <input
    type="password"
    id="password"
    data-i18n-placeholder="passwordPlaceholder"
    required>

                <span id="togglePassword">👁</span>

            </div>

            <button type="submit">
    <span data-i18n="login"></span>
</button>

        </form>

        <a href="../index.html" class="back-btn">
    <span data-i18n="backHome"></span>
</a>

    </div>

</div>

<script src="../translations/common-text.js"></script>
<script src="../translations/govlogin-text.js"></script>
<script src="../js/i18n.js"></script>

<script>
translatePage(govLoginText);
</script>

<script src="../js/govlogin.js"></script>

</body>

</html>
